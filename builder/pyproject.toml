[project]
name = "labctl"
version = "0.1.0"
description = "Talos lab provisioning and testing tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.4",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]
dev = [
    "ruff>=0.2",
    "mypy>=1.8",
    "types-paramiko",
    "types-requests",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
labctl = "labctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labctl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "smoke: basic functionality tests",
    "resilience: pod recovery and data persistence tests",
]
