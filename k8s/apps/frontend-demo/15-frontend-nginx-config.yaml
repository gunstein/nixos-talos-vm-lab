apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-frontend-nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 8080;

      # Static frontend
      location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
      }

      # Proxy API calls to demo-backend Service inside the cluster
      location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ClusterIP service
        proxy_pass http://demo-backend.demo.svc.cluster.local:8000;
      }
    }
