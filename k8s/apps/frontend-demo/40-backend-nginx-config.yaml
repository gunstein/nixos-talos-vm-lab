apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-backend-nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 8080;

      location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /api/hello {
        default_type application/json;
        return 200 "{\"message\":\"hello from demo-backend\",\"note\":\"no database yet\"}\n";
      }

      # Helpful fallback
      location / {
        default_type application/json;
        return 404 "{\"error\":\"not found\"}\n";
      }
    }
