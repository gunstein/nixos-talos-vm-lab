apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-db-init
  namespace: demo
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS items (
      id SERIAL PRIMARY KEY,
      name TEXT NOT NULL,
      created_at TIMESTAMP DEFAULT NOW()
    );
    ALTER TABLE items OWNER TO demo;
    ALTER SEQUENCE items_id_seq OWNER TO demo;
